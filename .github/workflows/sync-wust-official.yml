name: Sync WUST Official Talks & Deploy Pages

on:
  schedule:
    # 每 2 小时自动抓取一次武科大就业网最新宣讲会与双选会（完全替代 Muse 云端任务）
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "wust-talks-sync-pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest official talks & jobfairs from wust.91wllm.cn
        run: node scripts/sync-official-json.mjs

      - name: Commit updated live-data.json & demo-data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/live-data.json app/src/main/assets/www/demo-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-sync WUST official talks $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No schedule changes detected."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web bundle artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/src/main/assets/www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
